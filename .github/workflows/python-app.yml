name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install flake8 pytest pytest-cov pip-audit
      - name: Check Python syntax
        run: python -m compileall -q alarm_monitor
      - name: Lint for errors
        run: flake8 alarm_monitor tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with coverage
        run: pytest --tb=short --cov=alarm_monitor --cov-report=term-missing --cov-fail-under=75
      - name: Audit locked dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit -r requirements.lock --vulnerability-service osv

  docker:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag alarm-monitor:ci .
